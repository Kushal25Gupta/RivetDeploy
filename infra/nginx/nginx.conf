events {}
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- HTTP: Redirect all traffic to HTTPS ---
    server {
        listen 80;
        server_name _;

        return 301 https://$host$request_uri;
    }

    # --- HTTPS: Project subdomain routing ---
    server {
        listen 443 ssl;
        server_name "~^(?<project_id>[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})\.(?<base_domain>.+)$";

        ssl_certificate     /etc/letsencrypt/live/rivetdeploy.yagami.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rivetdeploy.yagami.tech/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://backend:8081/sites/projects/$project_id/current$uri$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # --- HTTPS: Main dashboard (default) ---
    server {
        listen 443 ssl default_server;

        ssl_certificate     /etc/letsencrypt/live/rivetdeploy.yagami.tech-dashboard/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rivetdeploy.yagami.tech-dashboard/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        location /api {
            proxy_pass http://backend:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location ~ ^/(oauth2|login|logout) {
            proxy_pass http://backend:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location /ws {
            proxy_pass http://backend:8081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }

        location /sites/ {
            proxy_pass http://backend:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
