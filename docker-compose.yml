version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: rivetdeploy-postgres
    environment:
      POSTGRES_USER: rivetdeploy
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rivetdeploy
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivetdeploy"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rivetdeploy-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rivetdeploy-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - artifacts_data:/tmp/rivetdeploy/artifacts:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rivetdeploy-backend
    ports:
      - "8081:8081"
    environment:
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - RIVET_QUEUE_TYPE=redis
      - SPRING_REDIS_HOST=redis
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/rivetdeploy
      - SPRING_DATASOURCE_USERNAME=rivetdeploy
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - RIVETDEPLOY_FRONTEND_URL=http://localhost:8082
      - RIVET_STORAGE_TYPE=s3
      - RIVETDEPLOY_STORAGE_S3_BUCKET=rivetdeploy-artifacts-20260823103847812900000001
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=us-east-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - artifacts_data:/tmp/rivetdeploy/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  artifacts_data:
