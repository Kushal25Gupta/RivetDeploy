version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: rivetdeploy-postgres
    environment:
      POSTGRES_USER: rivetdeploy
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rivetdeploy
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivetdeploy"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:latest
    container_name: rivetdeploy-nginx
    ports:
      - "8082:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rivetdeploy-backend
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/rivetdeploy
      - SPRING_DATASOURCE_USERNAME=rivetdeploy
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
